[project]
name = "spuma"
version = "0.1.0"
description = "SPUMA: Sum-Product Network for Multi-Agent Uncertainty Quantification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "dvc[s3]>=3.67.1",
    "dynaconf>=3.3.5",
    "hmmlearn>=0.3.3",
    "langchain-core>=1.6.9",
    "langgraph>=1.2.14",
    "math-verify[antlr4-9-3]>=0.9.0",
    "numpy>=2.3.0",
    "pydantic>=2.14.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "spflow>=1.1.0",
    "tenacity>=9.2.1",
    "tqdm>=4.67",
    "transformers>=5.10.4,<5.18",
    "uqlm==0.6.7",
]

[project.optional-dependencies]
cu126 = ["torch==2.14.1"]
cu128 = ["torch==2.11.0"]
cu130 = ["torch==2.14.1"]
cpu = ["torch==2.14.1"]
mps = ["torch==2.14.1"]
vllm = ["vllm==0.31.0; sys_platform == 'linux' and platform_machine in 'x86_64 aarch64'", "torch==2.13.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
wheel-exclude = ["**/tests", "**/tests/**", "**/conftest.py"]

[tool.uv]
conflicts = [
    [
        { extra = "cu126" },
        { extra = "cu128" },
        { extra = "cu130" },
        { extra = "cpu" },
        { extra = "mps" },
        { extra = "vllm" },
    ],
]
override-dependencies = [
    "transformers>=5.10.4,<5.18",
    "datasets>=5.1.0",
    # On Python < 3.13 uqlm caps numpy<2 but vllm needs numpy>=2 (uqlm runs on numpy 2 on 3.13+), and mistral-common
    # (via vllm) caps numpy<2.4.
    "numpy>=2.3.0,<2.4",
]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu",   extra = "cpu",   marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["spuma"]
addopts = [
    "-p", "spuma.common.tests.fixtures",
    "-p", "spuma.config.tests.fixtures",
    "-p", "spuma.models.tests.fixtures",
    "-p", "spuma.uncertainty.tests.fixtures",
]
markers = [
    "vllm: needs vLLM (Linux + NVIDIA GPU) and downloads a model",
    "nli: downloads the NLI model used for semantic entropy (microsoft/deberta-large-mnli, ~1.6 GB)",
    "gpu: needs a GPU and downloads the configured model (deselect with -m 'not gpu')",
]

[tool.coverage.run]
source = ["spuma"]
omit = ["**/tests/**", "**/conftest.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501"]
"**/conftest.py" = ["E501"]
