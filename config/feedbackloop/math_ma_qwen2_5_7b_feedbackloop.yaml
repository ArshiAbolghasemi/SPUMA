# SPUMA — the single configuration file. Each section is defined in its package's config.py and
# assembled/validated by spuma.config.settings.Settings at startup.
# Override any scalar with SPUMA_<SECTION>__<KEY>, e.g. SPUMA_MODEL__DEVICE=cpu.
# Secrets (HF_TOKEN) go in .env, never here.

project:
  name: spuma
  seed: 42

experiment:
  name: ma_qwen_math
  output_dir: artifacts
  resume: true
  concurrent_problems: 8

model:
  name: Qwen/Qwen2.5-7B-Instruct
  revision: null
  tokenizer_revision: null
  backend: vllm
  scoring_backend: same
  dtype: bfloat16
  enable_thinking: false
  generation:
    temperature: 0.7
    top_p: 1.0
    top_k: null
    max_new_tokens: 4096

  transformers:
    device: auto
    attn_implementation: sdpa
    scoring_chunk_size: 256

  vllm:
    max_model_len: 32768    # Qwen2.5-7B-Instruct's native maximum
    gpu_memory_utilization: 0.6
    tensor_parallel_size: 1
    max_logprobs: -1
    enforce_eager: false

  # Backend calls failing with a runtime error (CUDA OOM, engine errors), e.g. SPUMA_MODEL__RETRY__ATTEMPTS=5.
  retry:
    attempts: 3
    wait_s: 1.0
    max_wait_s: 30.0

models: {}

agents:
  workflow: feedback
  max_rounds: 10
  completion_token: TASK_DONE
  items:
    - id: mathematician
      model: default
      role: master_mathematician
      enabled: true
      system_prompt: >-
        You are the Master Mathematician, an expert in mathematical problem-solving. Solve problems
        accurately, explain your reasoning clearly, and respond to the Curious Math Enthusiast's questions
        and feedback. Correct mistakes when necessary, maintain conversation context, and present final
        answers using \boxed{} when appropriate.
      user_template: "Solve the following mathematical problem:\n\n{problem}"

    - id: enthusiast
      model: default
      role: curious_math_enthusiast
      enabled: true
      system_prompt: >-
        You are the Curious Math Enthusiast, collaborating with the Master Mathematician. Carefully examine
        mathematical solutions, ask relevant questions, request clarifications, and provide constructive
        feedback. Do not solve the problem yourself. When the solution is sufficiently complete and
        convincing, end your response with TASK_DONE. Otherwise, continue the discussion naturally.
      user_template: "Original mathematical problem:\n{problem}\n\nLatest response from the Master Mathematician:\n{previous}\n\nReview the response and provide your next question or feedback. If the solution is complete, end with TASK_DONE."

dataset:
  name: math
  source: huggingface
  hf_path: EleutherAI/hendrycks_math
  seed: 42
  train_samples: 800
  validation_samples: 200
  test_samples: 500

uncertainty:
  monte_carlo:
    num_generations: 10
    temperature: 0.7
    top_p: 1.0
    top_k: null
    max_new_tokens: null
    length_normalize: true

  monte_carlo_sequence_probability:
    enabled: true

  semantic_entropy:
    enabled: true
    backend: uqlm
    n: 10
    temperature: 0.7
    top_p: 1.0
    top_k: null
    max_new_tokens: null
    equivalence: answer_aware
    nli_model_name: tasksource/ModernBERT-large-nli
    nli_max_length: 8000
    nli_max_tokens: 2048
    nli_batch_size: 32
    nli_device: null

  semantic_density:
    enabled: false
    nli_model_name: tasksource/ModernBERT-large-nli
    nli_max_length: 8000
    nli_max_tokens: 2048
    nli_batch_size: 32
    nli_device: null

  nll:
    enabled: true

  token_length:
    enabled: true

aggregation:
  monte_carlo_sequence_probability: rms
  semantic_entropy: rms
  semantic_density: rms
  nll: rms
  token_length: mean

features:
  order:
    - mathematician_mcsp
    - mathematician_se
    - mathematician_nll
    - mathematician_length
    - enthusiast_mcsp
    - enthusiast_se
    - enthusiast_nll
    - enthusiast_length

spn:
  backend: spflow
  target: incorrect
  seed: 42
  leaf: histogram
  histogram:
    bins: 10
    strategy: uniform
    smoothing: 1.0
  min_instances_slice: 50
  min_features_slice: 2
  n_clusters: 2
  rdc_threshold: 0.3
  keep_label_dependence: true
  standardize: true
  prior_smoothing: 1.0

evaluation:
  metrics:
    - auroc
    - auarc
    - aurc
    - auprc
    - accuracy
    - brier
    - ece
    - nll
  ece_bins: 15
  risk_models: []  # SPNs are trained and evaluated by the chmm: section

  bootstrap:
    enabled: true
    iterations: 1000
    confidence: 0.95
    cluster_by: problem_id

# CHMM (SAUP-inspired) situational weighting of the saved step uncertainties: trained in the train phase,
# scored in evaluate, next to the risk models (artifacts in <scored>/chmm-<fp>/). Post-generation only.
chmm:
  enabled: true
  alphas: [0.5, 1, 2, 4]     # lambda(alpha) = [1, 1+alpha, 1+2 alpha]; fixed, never fitted to labels
  primary_alpha: 1
  distance:
    estimator: qa            # qa | lexical
    model: deepset/roberta-base-squad2
    revision: null
    max_length: 384
    stride: 128
    max_question_tokens: 128
    max_answer_tokens: 30
    batch_size: 16
    device: null             # null: mps, else cuda, else cpu
  hmm:                       # hmmlearn GaussianHMM
    n_components: 3
    covariance_type: diag
    n_iter: 200
    random_state: 42
  bootstrap_iterations: 10000
  confidence: 0.95
  feature_layout: per_agent  # per_agent (feedback: per agent; star/sequential: per response) | pooled

logging:
  level: DEBUG
  format: json
  console: true
  file: true
  directory: logs
