# SPUMA — MedHopQA (BioCreative IX), open-ended biomedical multi-hop questions.
# Star (fixed, single pass): star -> analyst -> star -> verifier -> star, 5 model calls; the final synthesis is graded.
# System prompts are composed from config/prompts/ fragments: general rules (roles/general) + dataset instructions + role
# (+ dataset-specific verification rules) + output schema. Every other section matches
# config/feedbackloop/math_ma_qwen2_5_7b_feedbackloop.yaml (model, sampling, seeds, uncertainty, SPN, evaluation).
# Override any scalar with SPUMA_<SECTION>__<KEY>. Secrets (HF_TOKEN) go in .env, never here.

project:
  name: spuma
  seed: 42

experiment:
  name: ma_qwen_medhopqa_star
  output_dir: artifacts
  resume: true
  concurrent_problems: 8

model:
  name: Qwen/Qwen2.5-7B-Instruct
  revision: null
  tokenizer_revision: null
  backend: vllm
  scoring_backend: same
  dtype: bfloat16
  enable_thinking: false
  generation:
    temperature: 0.7
    top_p: 1.0
    top_k: null
    max_new_tokens: 2048

  transformers:
    device: auto
    attn_implementation: sdpa
    scoring_chunk_size: 256

  vllm:
    max_model_len: 8192
    gpu_memory_utilization: 0.6
    tensor_parallel_size: 1
    max_logprobs: -1
    enforce_eager: false

  # Backend calls failing with a runtime error (CUDA OOM, engine errors), e.g. SPUMA_MODEL__RETRY__ATTEMPTS=5.
  retry:
    attempts: 3
    wait_s: 1.0
    max_wait_s: 30.0

models: {}

agents:
  workflow: star
  completion_token: TASK_DONE  # only the final synthesis appends it; stripped before scoring
  items:
    - id: star
      role: star_coordinator
      prompt: [roles/general, datasets/medhopqa, roles/star_coordinator, schemas/medhopqa]
      templates:
        delegation: "PHASE 1 — DELEGATION\n\n{problem}\n\nWrite your delegation to the Analyst."
        verification_request: "PHASE 2 — VERIFICATION REQUEST\n\nAnalyst's solution:\n{solution}\n\nWrite your verification request to the Verifier."
        final_synthesis: "PHASE 3 — FINAL SYNTHESIS\n\nVerifier's assessment:\n{assessment}\n\nSynthesize the final answer in the required format and append TASK_DONE."
    - id: analyst
      role: analyst
      prompt: [roles/general, datasets/medhopqa, roles/star_analyst, schemas/medhopqa]
      user_template: "{problem}\n\nRequest from Star (the coordinator):\n{request}"
    - id: verifier
      role: verifier
      prompt: [roles/general, datasets/medhopqa, roles/star_verifier, verification/medhopqa, schemas/medhopqa]
      user_template: "{problem}\n\nAnalyst's solution:\n{solution}\n\nVerification request from Star (the coordinator):\n{request}"

dataset:
  name: medhopqa
  # Manual download from the BioCreative IX CodaBench competition (codabench.org/competitions/7609, registration
  # required). Only the development set has gold answers; the ~10,000-question package (with the hidden 1,000
  # test questions) has none. No labeled training data exists, so no SPN or CHMM is fitted on MedHopQA: its
  # results come from the MATH-trained models, frozen (chmm.frozen_from). Columns are detected from the file and
  # logged; set `fields` if detection fails.
  source: local
  data_files:
    dev: data/medhopqa/dev.json  # the labeled development set (json, jsonl, csv or tsv)
  subsets: []
  labeled_only: true         # false: also generate on unlabeled questions (scored, never graded)
  seed: 42
  split_sources: {train: dev, validation: dev, test: dev}
  train_samples: 0
  validation_samples: 0
  test_samples: null         # every labeled development question

uncertainty:
  monte_carlo:
    num_generations: 10
    temperature: 0.7
    top_p: 1.0
    top_k: null
    max_new_tokens: null
    length_normalize: true

  monte_carlo_sequence_probability:
    enabled: true

  semantic_entropy:
    enabled: true
    backend: uqlm
    n: 10
    temperature: 0.7
    top_p: 1.0
    top_k: null
    max_new_tokens: null
    equivalence: answer_aware
    nli_model_name: tasksource/ModernBERT-large-nli
    nli_max_length: 8000
    nli_max_tokens: 2048
    nli_batch_size: 32
    nli_device: null

  semantic_density:
    enabled: false
    nli_model_name: tasksource/ModernBERT-large-nli
    nli_max_length: 8000
    nli_max_tokens: 2048
    nli_batch_size: 32
    nli_device: null

  nll:
    enabled: true

  token_length:
    enabled: true

aggregation:
  monte_carlo_sequence_probability: rms
  semantic_entropy: rms
  semantic_density: rms
  nll: rms
  token_length: mean

features:
  order:
    - star_mcsp
    - star_se
    - star_nll
    - star_length
    - analyst_mcsp
    - analyst_se
    - analyst_nll
    - analyst_length
    - verifier_mcsp
    - verifier_se
    - verifier_nll
    - verifier_length

spn:
  backend: spflow
  target: incorrect
  seed: 42
  leaf: histogram
  histogram:
    bins: 10
    strategy: uniform
    smoothing: 1.0
  min_instances_slice: 50
  min_features_slice: 2
  n_clusters: 2
  rdc_threshold: 0.3
  keep_label_dependence: true
  standardize: true
  prior_smoothing: 1.0

evaluation:
  metrics:
    - auroc
    - auarc
    - aurc
    - auprc
    - accuracy
    - brier
    - ece
    - nll
  ece_bins: 15
  risk_models:
    - spn
    - spn_class_conditional

  bootstrap:
    enabled: true
    iterations: 1000
    confidence: 0.95
    cluster_by: problem_id

# CHMM (SAUP-inspired) situational weighting of the saved step uncertainties: trained in the train phase,
# scored in evaluate, next to the risk models (artifacts in <scored>/chmm-<fp>/). Post-generation only.
chmm:
  enabled: true
  alphas: [0.5, 1, 2, 4]     # lambda(alpha) = [1, 1+alpha, 1+2 alpha]; fixed, never fitted to labels
  primary_alpha: 1
  distance:
    estimator: qa            # qa | lexical
    model: deepset/roberta-base-squad2
    revision: null
    max_length: 384
    stride: 128
    max_question_tokens: 128
    max_answer_tokens: 30
    batch_size: 16
    device: null             # null: mps, else cuda, else cpu
  hmm:                       # hmmlearn GaussianHMM
    n_components: 3
    covariance_type: diag
    n_iter: 200
    random_state: 42
  bootstrap_iterations: 10000
  confidence: 0.95
  frozen_from: [math_ma_qwen2_5_7b_star]   # the MATH-trained models of this architecture, frozen (OOD protocol)

logging:
  level: DEBUG
  format: json
  console: true
  file: true
  directory: logs
