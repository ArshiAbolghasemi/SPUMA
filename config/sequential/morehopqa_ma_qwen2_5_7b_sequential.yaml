# SPUMA — MoreHopQA (alabnii/morehopqa), closed-book multi-hop questions with a reasoning step on the last hop.
# Sequential (fixed, single pass): solver -> verifier -> finalizer, 3 model calls; the finalizer's response is graded.
# System prompts are composed from config/prompts/ fragments: general rules (roles/general) + dataset instructions + role
# (+ dataset-specific verification rules) + output schema. Every other section matches
# config/feedbackloop/math_ma_qwen2_5_7b_feedbackloop.yaml (model, sampling, seeds, uncertainty, SPN, evaluation).
# Override any scalar with SPUMA_<SECTION>__<KEY>. Secrets (HF_TOKEN) go in .env, never here.

project:
  name: spuma
  seed: 42

experiment:
  name: ma_qwen_morehopqa_sequential
  output_dir: artifacts
  resume: true
  concurrent_problems: 8

model:
  name: Qwen/Qwen2.5-7B-Instruct
  revision: null
  tokenizer_revision: null
  backend: vllm
  scoring_backend: same
  dtype: bfloat16
  enable_thinking: false
  generation:
    temperature: 0.7
    top_p: 1.0
    top_k: null
    max_new_tokens: 4096

  transformers:
    device: auto
    attn_implementation: sdpa
    scoring_chunk_size: 256

  vllm:
    max_model_len: 32768    # Qwen2.5-7B-Instruct's native maximum
    gpu_memory_utilization: 0.6
    tensor_parallel_size: 1
    max_logprobs: -1
    enforce_eager: false

  # Backend calls failing with a runtime error (CUDA OOM, engine errors), e.g. SPUMA_MODEL__RETRY__ATTEMPTS=5.
  retry:
    attempts: 3
    wait_s: 1.0
    max_wait_s: 30.0

models: {}

agents:
  workflow: sequential
  completion_token: TASK_DONE  # only the finalizer appends it; stripped before scoring
  items:
    - id: solver
      role: solver
      prompt: [roles/general, datasets/morehopqa, roles/sequential_solver, schemas/morehopqa]
      user_template: "{problem}"
    - id: verifier
      role: verifier
      prompt: [roles/general, datasets/morehopqa, roles/sequential_verifier, verification/morehopqa, schemas/morehopqa]
      user_template: "{problem}\n\nSolver's response:\n{solver}"
    - id: finalizer
      role: finalizer
      prompt: [roles/general, datasets/morehopqa, roles/sequential_finalizer, verification/morehopqa, schemas/morehopqa]
      user_template: "{problem}\n\nSolver's response:\n{solver}\n\nVerifier's assessment:\n{verifier}\n\nGive the final answer."

dataset:
  name: morehopqa
  source: huggingface
  hf_path: alabnii/morehopqa
  revision: e839079eb8eb686ecf42c6d334a87964f1b90eef
  # test: the human-verified set (1,118). train / validation: the generated set whose answers were NOT human-verified
  # (2,502), minus every question sharing its first hop (previous_question) with a verified question. Closed-book:
  # the agents see only the question.
  data_files:
    test: verified/test-00000-of-00001.parquet
    train: data/without_human_verification.json
  subsets: []
  seed: 42
  split_sources: {train: train, validation: train, test: test}
  train_samples: 480         # 616 unverified questions survive the first-hop filter
  validation_samples: 120
  test_samples: 500

uncertainty:
  monte_carlo:
    num_generations: 10
    temperature: 0.7
    top_p: 1.0
    top_k: null
    max_new_tokens: null
    length_normalize: true

  monte_carlo_sequence_probability:
    enabled: true

  semantic_entropy:
    enabled: true
    backend: uqlm
    n: 10
    temperature: 0.7
    top_p: 1.0
    top_k: null
    max_new_tokens: null
    equivalence: answer_aware
    nli_model_name: tasksource/ModernBERT-large-nli
    nli_max_length: 8000
    nli_max_tokens: 2048
    nli_batch_size: 32
    nli_device: null

  semantic_density:
    enabled: false
    nli_model_name: tasksource/ModernBERT-large-nli
    nli_max_length: 8000
    nli_max_tokens: 2048
    nli_batch_size: 32
    nli_device: null

  nll:
    enabled: true

  token_length:
    enabled: true

aggregation:
  monte_carlo_sequence_probability: rms
  semantic_entropy: rms
  semantic_density: rms
  nll: rms
  token_length: mean

features:
  order:
    - solver_mcsp
    - solver_se
    - solver_nll
    - solver_length
    - verifier_mcsp
    - verifier_se
    - verifier_nll
    - verifier_length
    - finalizer_mcsp
    - finalizer_se
    - finalizer_nll
    - finalizer_length

spn:
  backend: spflow
  target: incorrect
  seed: 42
  leaf: histogram
  histogram:
    bins: 10
    strategy: uniform
    smoothing: 1.0
  min_instances_slice: 50
  min_features_slice: 2
  n_clusters: 2
  rdc_threshold: 0.3
  keep_label_dependence: true
  standardize: true
  prior_smoothing: 1.0

# Class-conditional SPN next to the joint SPN: P(Z | Y=c) learned per class (LearnSPN, the `spn:` settings and
# preprocessing), P(Y=1 | Z) by Bayes' rule with the training prior. Each list is a grid; every candidate is fitted
# on the training split and the lowest validation Brier is kept. Methods `<spn method>_cc` in the chmm evaluation.
class_conditional_spn:
  enabled: true
  leaves: [normal, histogram]
  rdc_threshold: [0.1, 0.2, 0.3, 0.4]
  min_instances_slice: [25, 50, 100]
  variance_floor: [0.01, 0.1]       # normal leaves: sigma^2 >= floor (standardized features)
  histogram_smoothing: [1.0, 5.0]   # histogram leaves: Laplace pseudo-count per cell

evaluation:
  metrics:
    - auroc
    - auarc
    - aurc
    - auprc
    - accuracy
    - brier
    - ece
    - nll
  ece_bins: 15
  risk_models: []  # SPNs are trained and evaluated by the chmm: section

  bootstrap:
    enabled: true
    iterations: 1000
    confidence: 0.95
    cluster_by: problem_id

# CHMM (SAUP-inspired) situational weighting of the saved step uncertainties: trained in the train phase,
# scored in evaluate, next to the risk models (artifacts in <scored>/chmm-<fp>/). Post-generation only.
chmm:
  enabled: true
  alphas: [0.5, 1, 2, 4]     # lambda(alpha) = [1, 1+alpha, 1+2 alpha]; fixed, never fitted to labels
  primary_alpha: 1
  distance:
    estimator: qa            # qa | lexical
    model: deepset/roberta-base-squad2
    revision: null
    max_length: 384
    stride: 128
    max_question_tokens: 128
    max_answer_tokens: 30
    batch_size: 16
    device: null             # null: mps, else cuda, else cpu
  hmm:                       # hmmlearn GaussianHMM
    n_components: 3
    covariance_type: diag
    n_iter: 200
    random_state: 42
  bootstrap_iterations: 10000
  confidence: 0.95
  feature_layout: per_agent  # per_agent (feedback: per agent; star/sequential: per response) | pooled
  frozen_from: [math_ma_qwen2_5_7b_sequential]   # the MATH-trained models of this architecture, frozen (OOD protocol)

logging:
  level: DEBUG
  format: json
  console: true
  file: true
  directory: logs
