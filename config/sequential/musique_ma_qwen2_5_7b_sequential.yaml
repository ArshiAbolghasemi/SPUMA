# SPUMA — MuSiQue-Ans v1.0, evidence-grounded multi-hop questions over 20 context paragraphs.
# Sequential (fixed, single pass): solver -> verifier -> finalizer, 3 model calls; the finalizer's response is graded.
# System prompts are composed from config/prompts/ fragments: general rules (roles/general) + dataset instructions + role
# (+ dataset-specific verification rules) + output schema. Every other section matches
# config/feedbackloop/math_ma_qwen2_5_7b_feedbackloop.yaml (model, sampling, seeds, uncertainty, SPN, evaluation).
# Override any scalar with SPUMA_<SECTION>__<KEY>. Secrets (HF_TOKEN) go in .env, never here.

project:
  name: spuma
  seed: 42

experiment:
  name: ma_qwen_musique_sequential
  output_dir: artifacts
  resume: true
  concurrent_problems: 8

model:
  name: Qwen/Qwen2.5-7B-Instruct
  revision: null
  tokenizer_revision: null
  backend: vllm
  scoring_backend: same
  dtype: bfloat16
  enable_thinking: false
  generation:
    temperature: 0.7
    top_p: 1.0
    top_k: null
    max_new_tokens: 4096

  transformers:
    device: auto
    attn_implementation: sdpa
    scoring_chunk_size: 256

  vllm:
    max_model_len: 32768    # Qwen2.5-7B-Instruct's native maximum
    gpu_memory_utilization: 0.6
    tensor_parallel_size: 1
    max_logprobs: -1
    enforce_eager: false

  # Backend calls failing with a runtime error (CUDA OOM, engine errors), e.g. SPUMA_MODEL__RETRY__ATTEMPTS=5.
  retry:
    attempts: 3
    wait_s: 1.0
    max_wait_s: 30.0

models: {}

agents:
  workflow: sequential
  completion_token: TASK_DONE  # only the finalizer appends it; stripped before scoring
  items:
    - id: solver
      role: solver
      prompt: [roles/general, datasets/musique, roles/sequential_solver, schemas/musique]
      user_template: "{problem}"
    - id: verifier
      role: verifier
      prompt: [roles/general, datasets/musique, roles/sequential_verifier, verification/musique, schemas/musique]
      user_template: "{problem}\n\nSolver's response:\n{solver}"
    - id: finalizer
      role: finalizer
      prompt: [roles/general, datasets/musique, roles/sequential_finalizer, verification/musique, schemas/musique]
      user_template: "{problem}\n\nSolver's response:\n{solver}\n\nVerifier's assessment:\n{verifier}\n\nGive the final answer."

dataset:
  name: musique
  variant: ans               # MuSiQue-Full: variant: full, source: local, and data_files with the official
                             # musique_full_v1.0_{train,dev}.jsonl from github.com/StonyBrookNLP/musique
  source: huggingface
  hf_path: dgslibisey/MuSiQue  # verified mirror of the official v1.0 files (19,938 train / 2,417 dev)
  revision: c8f4f8c9465fb69d31a8eae894c3fd509c4ca321
  subsets: []
  seed: 42
  # The official test file has no answers: train and validation are disjoint draws from official train,
  # test from official dev.
  split_sources: {train: train, validation: train, test: dev}
  train_samples: 800
  validation_samples: 200
  test_samples: 500

uncertainty:
  monte_carlo:
    num_generations: 10
    temperature: 0.7
    top_p: 1.0
    top_k: null
    max_new_tokens: null
    length_normalize: true

  monte_carlo_sequence_probability:
    enabled: true

  semantic_entropy:
    enabled: true
    backend: uqlm
    n: 10
    temperature: 0.7
    top_p: 1.0
    top_k: null
    max_new_tokens: null
    equivalence: answer_aware
    nli_model_name: tasksource/ModernBERT-large-nli
    nli_max_length: 8000
    nli_max_tokens: 2048
    nli_batch_size: 32
    nli_device: null

  semantic_density:
    enabled: false
    nli_model_name: tasksource/ModernBERT-large-nli
    nli_max_length: 8000
    nli_max_tokens: 2048
    nli_batch_size: 32
    nli_device: null

  nll:
    enabled: true

  token_length:
    enabled: true

aggregation:
  monte_carlo_sequence_probability: rms
  semantic_entropy: rms
  semantic_density: rms
  nll: rms
  token_length: mean

features:
  order:
    - solver_mcsp
    - solver_se
    - solver_nll
    - solver_length
    - verifier_mcsp
    - verifier_se
    - verifier_nll
    - verifier_length
    - finalizer_mcsp
    - finalizer_se
    - finalizer_nll
    - finalizer_length

spn:
  backend: spflow
  target: incorrect
  seed: 42
  leaf: histogram
  histogram:
    bins: 10
    strategy: uniform
    smoothing: 1.0
  min_instances_slice: 50
  min_features_slice: 2
  n_clusters: 2
  rdc_threshold: 0.3
  keep_label_dependence: true
  standardize: true
  prior_smoothing: 1.0

evaluation:
  metrics:
    - auroc
    - auarc
    - aurc
    - auprc
    - accuracy
    - brier
    - ece
    - nll
  ece_bins: 15
  risk_models: []  # SPNs are trained and evaluated by the chmm: section

  bootstrap:
    enabled: true
    iterations: 1000
    confidence: 0.95
    cluster_by: problem_id

# CHMM (SAUP-inspired) situational weighting of the saved step uncertainties: trained in the train phase,
# scored in evaluate, next to the risk models (artifacts in <scored>/chmm-<fp>/). Post-generation only.
chmm:
  enabled: true
  alphas: [0.5, 1, 2, 4]     # lambda(alpha) = [1, 1+alpha, 1+2 alpha]; fixed, never fitted to labels
  primary_alpha: 1
  distance:
    estimator: qa            # qa | lexical
    model: deepset/roberta-base-squad2
    revision: null
    max_length: 384
    stride: 128
    max_question_tokens: 128
    max_answer_tokens: 30
    batch_size: 16
    device: null             # null: mps, else cuda, else cpu
  hmm:                       # hmmlearn GaussianHMM
    n_components: 3
    covariance_type: diag
    n_iter: 200
    random_state: 42
  bootstrap_iterations: 10000
  confidence: 0.95
  feature_layout: per_agent  # per_agent (feedback: per agent; star/sequential: per response) | pooled
  frozen_from: [math_ma_qwen2_5_7b_sequential]   # the MATH-trained models of this architecture, frozen (OOD protocol)

logging:
  level: DEBUG
  format: json
  console: true
  file: true
  directory: logs
