# SPUMA — the single configuration file. Each section is defined in its package's config.py and
# assembled/validated by spuma.config.settings.Settings at startup.
# Override any scalar with SPUMA_<SECTION>__<KEY>, e.g. SPUMA_MODEL__DEVICE=cpu.
# Secrets (HF_TOKEN) go in .env, never here.

project:
  name: spuma
  seed: 42

experiment:
  name: ma_qwen_math
  output_dir: artifacts
  resume: true
  concurrent_problems: 8

model:
  name: Qwen/Qwen2.5-7B-Instruct
  revision: null
  tokenizer_revision: null
  backend: vllm
  scoring_backend: transformers
  dtype: bfloat16
  enable_thinking: false
  generation:
    temperature: 0.7
    top_p: 1.0
    top_k: null
    max_new_tokens: 2048

  transformers:
    device: auto
    attn_implementation: sdpa
    scoring_chunk_size: 256

  vllm:
    max_model_len: 8192
    gpu_memory_utilization: 0.85
    tensor_parallel_size: 1
    max_logprobs: -1
    enforce_eager: false

models: {}

agents:
  workflow: sequential
  items:
    - id: solver
      model: default
      role: solver
      enabled: true
      system_prompt: >-
        Solve mathematical problems step by step.
        Put the final answer in \boxed{}.
      user_template: "Problem:\n{problem}"

    - id: reviewer
      model: default
      role: reviewer
      enabled: true
      system_prompt: >-
        Review mathematical reasoning, verify calculations, correct mistakes, and produce the final answer.
        Put the final answer in \boxed{}.
      user_template: "Problem:\n{problem}\n\nProposed solution:\n{previous}\n\nReview it and give the final answer."

dataset:
  name: math
  source: huggingface
  hf_path: EleutherAI/hendrycks_math
  seed: 42
  train_samples: 800
  validation_samples: 200
  test_samples: 500

uncertainty:
  predictive_entropy:
    enabled: true
    full_vocabulary: true
    distribution: raw_model

  semantic_entropy:
    enabled: true
    backend: uqlm
    n: 10
    temperature: 0.7
    top_p: 1.0
    top_k: null
    max_new_tokens: null
    equivalence: answer_aware
    nli_model_name: tasksource/ModernBERT-large-nli
    nli_max_length: 8000
    nli_max_tokens: 2048
    nli_batch_size: 32
    nli_device: null

  nll:
    enabled: true
    normalize_by_length: true

  token_length:
    enabled: true

aggregation:
  predictive_entropy: rms
  semantic_entropy: rms
  nll: rms
  token_length: mean

features:
  order:
    - solver_pe
    - solver_se
    - solver_nll
    - solver_length
    - reviewer_pe
    - reviewer_se
    - reviewer_nll
    - reviewer_length

spn:
  backend: spflow
  target: incorrect
  seed: 42
  leaf: histogram
  histogram:
    bins: 10
    strategy: uniform
    smoothing: 1.0
  min_instances_slice: 50
  min_features_slice: 2
  n_clusters: 2
  rdc_threshold: 0.3
  keep_label_dependence: true
  standardize: true
  prior_smoothing: 1.0

evaluation:
  metrics:
    - auroc
    - auarc
    - aurc
    - auprc
    - accuracy
    - brier
    - ece
    - nll
  ece_bins: 15
  risk_models:
    - spn
    - spn_class_conditional

  bootstrap:
    enabled: true
    iterations: 1000
    confidence: 0.95
    cluster_by: problem_id

logging:
  level: INFO
  format: json
  console: true
  file: true
  directory: logs
